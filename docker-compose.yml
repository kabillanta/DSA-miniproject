# ==============================================================================
# Docker Compose Orchestration for Real-Time Server Health Monitoring & Anomaly Detection
# Architecture: Zookeeper -> Kafka Broker -> ML Stream Consumer -> PostgreSQL -> Streamlit Dashboard
# ==============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_SERVER_ID: 1
    networks:
      - server-monitoring
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,DOCKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,DOCKER://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      zookeeper:
        condition: service_healthy
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - server-monitoring
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: server_health_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - server-monitoring
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d server_health_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-producer:
    build: 
      context: ./kafka-producer
      dockerfile: Dockerfile
    container_name: kafka-producer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_TOPIC: server-metrics
      PRODUCER_INTERVAL_SECONDS: "1.0"
      ANOMALY_PROBABILITY: "0.08"
      SERVER_IDS: "server-01,server-02,server-03"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - server-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  ml-consumer:
    build: 
      context: ./ml-consumer
      dockerfile: Dockerfile
    container_name: ml-consumer
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9094
      KAFKA_TOPIC: server-metrics
      KAFKA_CONSUMER_GROUP: server-health-processor-group
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: server_health_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SLIDING_WINDOW_SIZE: "30"
      MODEL_PATH: /app/models/isolation_forest.joblib
    depends_on:
      kafka:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - server-monitoring
    volumes:
      - ml-models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  dashboard:
    build: 
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: streamlit-dashboard
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: server_health_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DASHBOARD_REFRESH_INTERVAL: "2"
      DASHBOARD_HISTORY_LIMIT: "100"
    depends_on:
      db:
        condition: service_healthy
      ml-consumer:
        condition: service_started
    networks:
      - server-monitoring
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M

networks:
  server-monitoring:
    driver: bridge

volumes:
  kafka-data:
    driver: local
  db-data:
    driver: local
  ml-models:
    driver: local
